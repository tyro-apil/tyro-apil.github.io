{{ $src := .Get "src" }}
{{ $alt := .Get "alt" | default "" }}
{{ $height := .Get "height" }}
{{ $width := .Get "width" }}
{{ $caption := .Get "caption" }}

<figure class="dark_mode_illustration_wrapper">
    <img src="{{ $src }}" alt="{{ $alt }}" class="dark_mode_illustration" {{ with $width }} width="{{ . }}" {{ end }}
        {{ with $height }} height="{{ . }}" {{ end }}>

    {{ with $caption }}
    <figcaption>{{ . }}</figcaption>
    {{ end }}
</figure>
